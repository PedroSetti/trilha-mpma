plugins { id 'com.android.application' }
android {
 namespace 'br.com.pedrosetti.trilhaconcursos'
 compileSdk 35
 defaultConfig { applicationId 'br.com.pedrosetti.trilhaconcursos'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.0.2' }
 signingConfigs { release { storeFile file(System.getenv('TRILHA_KEYSTORE')); storePassword System.getenv('TRILHA_STORE_PASSWORD'); keyAlias 'trilha'; keyPassword System.getenv('TRILHA_KEY_PASSWORD') } }
 buildTypes { release { minifyEnabled false; debuggable false; signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
